name: Repository Governance & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify core documentation and security posture
        run: |
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f .gitignore || (echo "Missing .gitignore" && exit 1)
          if find . -maxdepth 3 -name ".env" | grep -q .; then
            echo "SECURITY ALERT: .env file detected!"
            exit 1
          fi
          echo "Governance check passed."
